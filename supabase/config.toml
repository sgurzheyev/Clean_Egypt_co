
[functions.create-payment-intent]
enabled = true
verify_jwt = true
import_map = "./functions/create-payment-intent/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-payment-intent/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-payment-intent/*.html" ]

# Stripe POSTs without a Supabase JWT — signature is verified via STRIPE_WEBHOOK_SECRET.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"

# Invoked by DB webhook / pg_net (no end-user JWT). Optional CITY_NOTIFICATION_WEBHOOK_SECRET.
[functions.city-notification-pipeline]
enabled = true
verify_jwt = false
import_map = "./functions/city-notification-pipeline/deno.json"
entrypoint = "./functions/city-notification-pipeline/index.ts"

# Phase 5: notifications INSERT → FCM / Web Push. Auth via service role + optional PUSH_WEBHOOK_SECRET.
[functions.send-push-notification]
enabled = true
verify_jwt = false
import_map = "./functions/send-push-notification/deno.json"
entrypoint = "./functions/send-push-notification/index.ts"

# GDPR account deletion (requires user JWT; Storage purge + auth.admin.deleteUser).
[functions.delete-account]
enabled = true
verify_jwt = true
import_map = "./functions/delete-account/deno.json"
entrypoint = "./functions/delete-account/index.ts"

# Crowdfunding proof video: worker-only PUT presign to Cloudflare R2.
[functions.r2-presign-proof]
enabled = true
verify_jwt = true
import_map = "./functions/r2-presign-proof/deno.json"
entrypoint = "./functions/r2-presign-proof/index.ts"

# Crowdfunding proof video: donor/creator/worker GET presign from R2.
[functions.r2-sign-playback]
enabled = true
verify_jwt = true
import_map = "./functions/r2-sign-playback/deno.json"
entrypoint = "./functions/r2-sign-playback/index.ts"

# General authenticated media PUT to R2 (KYC, stores, avatars, mission photos, chat).
[functions.r2-presign-media]
enabled = true
verify_jwt = true
import_map = "./functions/r2-presign-media/deno.json"
entrypoint = "./functions/r2-presign-media/index.ts"

# Admin KYC review: signed GET for R2 kyc/ keys + legacy Storage kyc_documents.
[functions.kyc-admin-signed-urls]
enabled = true
verify_jwt = true
import_map = "./functions/kyc-admin-signed-urls/deno.json"
entrypoint = "./functions/kyc-admin-signed-urls/index.ts"

# Stripe PaymentIntents — user JWT required (gateway + in-function getUser).
[functions.stripe-token-intent]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-token-intent/index.ts"

[functions.stripe-subscription-intent]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-subscription-intent/index.ts"

[functions.stripe-intent]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-intent/index.ts"

[functions.stripe-token-credit]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-token-credit/index.ts"

[functions.stripe-subscription-activate]
enabled = true
verify_jwt = true
entrypoint = "./functions/stripe-subscription-activate/index.ts"
