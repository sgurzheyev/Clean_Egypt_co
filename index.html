    <style>
      body {
        font-family: 'Nunito', sans-serif;
      }

      /* LazyMissionPhoto — shimmer sweep keyframe (CDN Tailwind has no extend). */
      @keyframes skeletonSweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .skeleton-sweep {
        animation: skeletonSweep 1.6s ease-in-out infinite;
      }

      /* Boot splash — GPU-only (transform/opacity). Matches PWA icon continuity. */
      #gg-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060a;
        transition: opacity 0.28s ease-out;
        pointer-events: none;
      }
      #gg-boot-splash svg {
        width: 72px;
        height: 72px;
        transform: translateZ(0);
      }
      @keyframes ggLogoRingPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.045); opacity: 0.82; }
      }
      .gg-logo-ring-pulse {
        transform-origin: 64px 64px;
        animation: ggLogoRingPulse 1.35s ease-in-out infinite;
        will-change: transform, opacity;
      }
      @keyframes ggLogoLoaderSpin {
        to { transform: rotate(360deg); }
      }
      .gg-logo-loader-spin {
        animation: ggLogoLoaderSpin 0.85s linear infinite;
        will-change: transform;
        transform: translateZ(0);
      }
      @media (prefers-reduced-motion: reduce) {
        .gg-logo-ring-pulse,
        .gg-logo-loader-spin {
          animation: none !important;
        }
      }
    </style>
  <script type="importmap">

         so launch → React splash feels continuous (removed by MapBootSplash). -->

      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
